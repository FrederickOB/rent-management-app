name: rent-platform

services:
  postgres:
    image: postgres:18.6
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
      TZ: UTC
    ports:
      - '54320:5432'
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./packages/db/sql/bootstrap.sql:/docker-entrypoint-initdb.d/01-bootstrap.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d rent']
      interval: 2s
      timeout: 3s
      retries: 30

  seaweedfs:
    image: chrislusf/seaweedfs:4.51
    command: >
      server -dir=/data -ip.bind=0.0.0.0 -master.volumeSizeLimitMB=256
      -s3 -s3.port=8333 -s3.config=/etc/seaweedfs/s3.json
    ports:
      - '8333:8333'
    volumes:
      - seaweedfs-data:/data
      - ./docker/seaweedfs/s3.json:/etc/seaweedfs/s3.json:ro
    healthcheck:
      test: ['CMD-SHELL', 'wget -q -O /dev/null http://127.0.0.1:8333/healthz || exit 1']
      interval: 2s
      timeout: 3s
      retries: 60

  mailpit:
    image: axllent/mailpit:v1.32
    ports:
      - '1025:1025'
      - '8025:8025'
    healthcheck:
      test: ['CMD', '/mailpit', 'readyz']
      interval: 2s
      timeout: 3s
      retries: 30

  fake-providers:
    build:
      context: .
      dockerfile: apps/fake-providers/Dockerfile
    environment:
      PORT: '4010'
      NODE_ENV: development
      FAKE_PAYMENTS_SECRET_KEY: ${FAKE_PAYMENTS_SECRET_KEY:-}
      FAKE_PAYMENTS_WEBHOOK_URL: ${FAKE_PAYMENTS_WEBHOOK_URL:-}
      FAKE_WHATSAPP_APP_SECRET: ${FAKE_WHATSAPP_APP_SECRET:-}
      # M6: the fake's inbound messages and delivery reports go to the API on the host by
      # default (an empty value in .env turns one off). The secrets are the API's dev stand-ins.
      FAKE_WHATSAPP_WEBHOOK_URL: ${FAKE_WHATSAPP_WEBHOOK_URL-http://host.docker.internal:3700/webhooks/whatsapp}
      FAKE_WHATSAPP_PHONE_NUMBER_ID: ${FAKE_WHATSAPP_PHONE_NUMBER_ID:-}
      FAKE_IDENTITY_WEBHOOK_URL: ${FAKE_IDENTITY_WEBHOOK_URL:-}
      FAKE_SMS_INBOUND_URL: ${FAKE_SMS_INBOUND_URL-http://host.docker.internal:3700/webhooks/sms/inbound?secret=dev-only-messaging-webhook-secret}
      FAKE_SMS_STATUS_URL: ${FAKE_SMS_STATUS_URL-http://host.docker.internal:3700/webhooks/sms/status?secret=dev-only-messaging-webhook-secret}
      FAKE_EMAIL_INBOUND_URL: ${FAKE_EMAIL_INBOUND_URL-http://host.docker.internal:3700/webhooks/email/inbound?secret=dev-only-messaging-webhook-secret}
      FAKE_EMAIL_EVENTS_URL: ${FAKE_EMAIL_EVENTS_URL-http://host.docker.internal:3700/webhooks/email/events?secret=dev-only-messaging-webhook-secret}
    extra_hosts:
      # host.docker.internal on Linux too (Docker Desktop provides it on macOS).
      - 'host.docker.internal:host-gateway'
    ports:
      - '4010:4010'
    healthcheck:
      test: ['CMD-SHELL', 'wget -q -O /dev/null http://127.0.0.1:4010/health || exit 1']
      interval: 2s
      timeout: 3s
      retries: 30

  # M11 decision 6: ClamAV for malware scanning of uploads, only with `--profile scan` (it needs
  # about 1.5 GB of memory). The worker and API use it with MALWARE_SCANNER=clamav; the fake
  # scanner is the default otherwise. The debian variant is the multi-architecture image (arm64
  # too). The first start downloads the signatures, which takes a few minutes.
  clamav:
    image: clamav/clamav:1.5.4-debian
    profiles: ['scan']
    ports:
      - '3310:3310'
    volumes:
      - clamav-data:/var/lib/clamav
    healthcheck:
      test: ['CMD-SHELL', 'clamdcheck.sh || exit 1']
      interval: 10s
      timeout: 5s
      retries: 60
      start_period: 300s

volumes:
  postgres-data:
  seaweedfs-data:
  clamav-data:
