packages:
  - apps/*
  - packages/*

# Versions shared across the workspace. Packages refer to them as "catalog:".
catalog:
  '@aws-sdk/client-s3': 3.1158.0
  '@aws-sdk/s3-presigned-post': 3.1158.0
  '@aws-sdk/s3-request-presigner': 3.1158.0
  '@better-auth/expo': 1.7.14
  '@eslint/js': 10.0.1
  '@nestjs/common': 12.3.2
  '@nestjs/core': 12.3.2
  '@nestjs/platform-fastify': 12.3.2
  '@nestjs/testing': 12.3.2
  '@orpc/client': 1.16.1
  '@orpc/contract': 1.16.1
  '@orpc/nest': 1.16.1
  '@orpc/openapi': 1.16.1
  '@orpc/openapi-client': 1.16.1
  '@orpc/server': 1.16.1
  '@orpc/zod': 1.16.1
  '@playwright/test': 1.64.1
  '@thallesp/nestjs-better-auth': 2.8.0
  '@types/node': 24.19.2
  '@types/pg': 8.23.1
  '@types/react': 19.3.0
  '@types/react-dom': 19.3.0
  better-auth: 1.7.14
  drizzle-kit: 0.31.11
  drizzle-orm: 0.45.4
  eslint: 10.13.0
  fast-check: 4.10.2
  globals: 17.13.0
  libphonenumber-js: 1.13.15
  next: 16.4.3
  otplib: 13.5.0
  pg: 8.23.1
  pg-boss: 12.38.0
  pino: 10.4.0
  playwright: 1.64.1
  prettier: 3.9.10
  react: 19.3.0
  react-dom: 19.3.0
  reflect-metadata: 0.2.2
  rxjs: 7.8.2
  temporal-polyfill: 1.0.6
  tsx: 4.23.15
  turbo: 2.11.10
  typescript: 6.0.3
  typescript-eslint: 8.72.1
  uuid: 14.0.3
  vitest: 5.0.5
  zod: 4.6.7

# Packages allowed to run install scripts (pnpm blocks the rest).
allowBuilds:
  esbuild: true
  sharp: true
  '@parcel/watcher': true
  unrs-resolver: true

# Versions newer than pnpm's default minimum release age, recorded by pnpm on install.
# Expo SDK 58 patch releases of 2026-10-28; review and drop entries once they age out.
minimumReleaseAgeExclude:
  - '@expo/cli@58.1.17'
  - '@expo/config-plugins@58.0.11'
  - '@expo/config@58.0.9'
  - '@expo/image-utils@0.12.6'
  - '@expo/inline-modules@0.2.8'
  - '@expo/local-build-cache-provider@58.0.9'
  - '@expo/metro-config@58.0.19'
  - '@expo/modules-macros-linux-arm64@0.27.1'
  - '@expo/modules-macros-linux-x64@0.27.1'
  - '@expo/modules-macros-win32-arm64@0.27.1'
  - '@expo/modules-macros-win32-x64@0.27.1'
  - '@expo/prebuild-config@58.0.17'
  - '@expo/require-utils@58.0.5'
  - '@expo/router-server@58.0.19'
  - babel-preset-expo@58.0.22
  - expo-asset@58.0.19
  - expo-constants@58.0.14
  - expo-file-system@58.0.13
  - expo-font@58.0.11
  - expo-linking@58.0.15
  - expo-modules-autolinking@58.0.16
  - expo-modules-cli@0.4.0
  - expo-modules-core@58.0.28
  - expo-modules-jsi@58.0.21
  - expo-modules-macros@0.27.1
  - expo-router@58.0.28
  - expo@58.0.21
  - jest-expo@58.0.13
