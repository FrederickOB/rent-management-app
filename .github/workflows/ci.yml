name: CI

on:
  # Branches are checked through their pull requests, so a pull request is not checked twice.
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  # A newer push cancels a pull request's running checks. Each commit on main gets a group of its
  # own, so none is cancelled while queued and every one is checked in full.
  group: ci-${{ github.ref == 'refs/heads/main' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  COREPACK_ENABLE_DOWNLOAD_PROMPT: '0'
  NEXT_TELEMETRY_DISABLED: '1'
  TURBO_TELEMETRY_DISABLED: '1'

jobs:
  static:
    name: Format, lint and typecheck
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck

  audit:
    # M11 decision 6: known advisories in the dependencies. Production dependencies (what the api,
    # worker, web, links and tenant app ship) fail the build on a high or critical advisory. Dev
    # dependencies (build and test tools, which run only here and on developers' machines, with no
    # production data or secrets) are audited too, but only reported: an advisory in a test tool
    # should not block unrelated work. Revisit that when M12's deploy pipeline holds credentials.
    name: Dependency audit
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - name: Enable Corepack
        run: corepack enable
      # Ignored, approved by the founder on 2026-11-10 (M11 plan section 9, Operations):
      # GHSA-mrhx-c7xc-m3w5, zod 3.25.76 inside @expo/cli, a build-time CLI that never ships in the
      # app bundle; zod 3 has no fixed release. Drop the ignore when Expo moves to zod 4.
      # The exception covers one zod version through two build-time tools only (M11 review B11).
      - name: The audit exception still covers only zod 3.25.76 through @expo/cli and chromium-bidi
        run: node scripts/ci-check-audit-exception.mjs
      - name: Production dependencies, failing on high and critical
        run: pnpm audit --prod --audit-level high --ignore GHSA-mrhx-c7xc-m3w5
      - name: Every dependency, dev included (advisory)
        continue-on-error: true
        run: pnpm audit --audit-level high --ignore GHSA-mrhx-c7xc-m3w5

  unit:
    name: Unit tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: pnpm test:unit

  integration:
    name: Integration tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: cp .env.example .env
      # M11 decision 6: the real ClamAV for the malware-scanning tests (the EICAR file), from
      # Compose's `scan` profile: clamav/clamav:1.5.4-debian on 3310, with its own health check.
      # Started first, without waiting: clamd loads its signatures (a minute or more) while the job
      # sets up, and the step before the tests waits for it. The tests find it on localhost:3310,
      # their default (CLAMAV_HOST, CLAMAV_PORT).
      - name: Start ClamAV
        run: docker compose --profile scan up -d clamav
      - run: docker compose up -d --wait postgres seaweedfs mailpit
      - run: pnpm db:migrate
      - name: Install Chromium's headless shell for the PDF renderer tests
        run: pnpm exec playwright install --with-deps --only-shell chromium
      - name: Wait for ClamAV to load its signatures
        run: docker compose --profile scan up -d --wait --wait-timeout 600 clamav
      # What `pnpm test` does, with a JSON report per package for the traceability table (M11 plan
      # 4.10): the rest of Compose (fake-providers) first, then every package's Vitest run, unit and
      # integration projects both. --continue, so one failing package does not stop the others. The
      # arguments after `--` reach each package's `vitest run`; the report lands in its gitignored
      # test-results/. The tenant app's Jest suites run in the Expo job, on a runner of their own:
      # here they shared the CPUs with every database suite, and a first render took past their
      # 60 s timeout (M3).
      - name: Unit and integration tests
        run: |
          docker compose up -d --wait
          pnpm exec turbo run test --continue --filter='!@rent/tenant' -- \
            --reporter=default --reporter=json --outputFile.json=test-results/vitest.json
      - name: Keep the test reports for the traceability table
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: test-reports-vitest
          path: |
            apps/*/test-results/vitest.json
            packages/*/test-results/vitest.json
          if-no-files-found: warn
          retention-days: 30
      # Those tests skip when clamd is unreachable; here a skip is a failure.
      - name: The real ClamAV tests ran
        if: ${{ !cancelled() }}
        run: |
          node scripts/ci-assert-ran.mjs --title 'the real ClamAV' --min 3 \
            packages/integrations/test-results/vitest.json packages/server/test-results/vitest.json
      - name: Show service logs
        if: failure()
        run: docker compose --profile scan logs --no-color

  speed:
    # M9 plan section 6: the dashboard, the rollup and the Excel export at 5,000 units. Advisory:
    # a slow or failed run never fails the build. A job of its own, because building the fixture
    # through the services takes about 15 minutes, which the integration job's 30 cannot spare.
    name: Speed check at 5,000 units (advisory)
    runs-on: ubuntu-24.04
    # Two test files each build the 5,000-unit fixture (about 15 minutes each, side by side).
    timeout-minutes: 75
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: cp .env.example .env
      - run: docker compose up -d --wait postgres seaweedfs mailpit
      - run: pnpm db:migrate
      - name: Dashboard and statement speed at 5,000 units
        env:
          RENT_SPEED: '1'
        run: pnpm --filter @rent/server exec vitest run --project integration test/dashboard-speed.int.test.ts test/statement-speed.int.test.ts --silent=false

  e2e:
    name: End-to-end tests
    runs-on: ubuntu-24.04
    # 45 for the specs, and 10 to 15 more for the Lighthouse budgets' 16 runs (M11).
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: cp .env.example .env
      # pnpm test:e2e brings the services up again with --no-recreate, so the fake provider keeps
      # the subaccounts and charges the seed made (it holds them in memory).
      - name: Start every Compose service, fake-providers included
        run: docker compose up -d --wait
      - run: pnpm db:migrate
      # Before the seed, which renders the demo notices' PDFs with Chromium (M7).
      - name: Install Chromium for Playwright
        run: pnpm exec playwright install --with-deps chromium
      - run: pnpm db:seed
      - name: Build web and links
        run: pnpm exec turbo run build --filter=@rent/web --filter=@rent/links
      - name: Start api, worker, web and links
        env:
          # The web tests sign in many times from one address; Better Auth's per-IP limits
          # would refuse them. The config refuses this setting in production.
          AUTH_RATE_LIMITS: 'off'
          # M10: the API's test controls (an overdue subscription invoice on demand). The
          # config refuses this setting in production too.
          E2E_TEST_CONTROLS: 'on'
          # M11: the cooling-off test control runs as the owner role on the same (throwaway)
          # database; it refuses any other database.
          E2E_DATABASE_OWNER_URL: postgres://rent_owner:rent_owner_dev@localhost:54320/rent
        run: |
          mkdir -p "$RUNNER_TEMP/e2e-logs"
          for app in api worker web links; do
            nohup pnpm --filter "@rent/$app" start >"$RUNNER_TEMP/e2e-logs/$app.log" 2>&1 &
            echo "$!" >"$RUNNER_TEMP/e2e-logs/$app.pid"
          done
      # Exported while the apps start.
      - name: Export the Expo web build
        run: pnpm --filter @rent/tenant build
      - name: Serve the Expo web build on 8081
        run: |
          nohup node scripts/serve-spa.mjs apps/tenant/web-build 8081 \
            >"$RUNNER_TEMP/e2e-logs/tenant-web.log" 2>&1 &
      - name: Wait for the apps
        run: |
          for url in http://localhost:3700/health/ready http://localhost:3701 \
            http://localhost:3702/health http://localhost:8081; do
            if ! timeout 120 bash -c "until curl -fsS -o /dev/null $url; do sleep 1; done"; then
              echo "::error::$url did not answer within 120 seconds"
              exit 1
            fi
          done
          # The worker has no HTTP port, so check that it is still running.
          kill -0 "$(cat "$RUNNER_TEMP/e2e-logs/worker.pid")"
      # What `pnpm test:e2e` does, one app at a time as its --concurrency=1 does, with Playwright's
      # JSON report per app for the traceability table (M11 plan 4.10). A failing app does not stop
      # the others (turbo's --continue). The reporters given here replace each config's own.
      - name: End-to-end tests for web, links and the tenant web build
        run: |
          docker compose up -d --wait --no-recreate
          mkdir -p "$GITHUB_WORKSPACE/test-reports"
          status=0
          for app in web links tenant; do
            PLAYWRIGHT_JSON_OUTPUT_FILE="$GITHUB_WORKSPACE/test-reports/e2e-$app.json" \
              pnpm --filter "@rent/$app" exec playwright test --reporter=list,html,json || status=1
          done
          exit "$status"
      # M11 decision 8: Lighthouse budgets for every links page and the tenant web app's screens,
      # over the 3G profile with a 4x slower CPU, against the stack started above (apps/links/
      # lighthouse). A missed error-level budget fails the job. It runs even when a spec failed,
      # so both results are seen.
      - name: Lighthouse budgets
        if: ${{ !cancelled() }}
        run: pnpm test:lighthouse
      - name: Show the Lighthouse table in the run summary
        if: ${{ !cancelled() }}
        run: cat apps/links/lighthouse/.results/summary.md >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true
      - name: Keep the Lighthouse reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: lighthouse
          path: apps/links/lighthouse/.results
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 30
      - name: Keep the test reports for the traceability table
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: test-reports-playwright
          path: test-reports/e2e-*.json
          if-no-files-found: warn
          retention-days: 30
      - name: Upload app logs and Playwright results
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-results
          path: |
            ${{ runner.temp }}/e2e-logs
            apps/*/test-results
            apps/*/playwright-report
          retention-days: 7

  expo:
    name: Expo tests and web export
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      # The `test` script (jest --ci), with Jest's JSON report for the traceability table. Jest
      # writes the report whether the tests pass or fail, but does not create its folder.
      - name: Tenant app tests
        run: |
          mkdir -p apps/tenant/test-results
          pnpm --filter @rent/tenant exec jest --ci --json --outputFile=test-results/jest.json
      - name: Keep the test report for the traceability table
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: test-reports-jest
          path: apps/tenant/test-results/jest.json
          # Jest writes it in every case, so a missing report is an error, never hidden.
          if-no-files-found: error
          retention-days: 30
      - run: pnpm --filter @rent/tenant build

  backup:
    name: Backup and restore
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: cp .env.example .env
      # The seed takes its demo payments through the fake payment provider (M4b), so it runs too.
      - run: docker compose up -d --wait postgres seaweedfs mailpit fake-providers
      - run: pnpm db:migrate
      - name: Install Chromium's headless shell for the seed's notice PDFs
        run: pnpm exec playwright install --with-deps --only-shell chromium
      - run: pnpm db:seed
      - name: Restore a dump and verify its audit chains
        run: bash scripts/ci-restore-check.sh

  traceability:
    # M11 plan 4.10: every MVP requirement ID has a passing test. Reads the reports the test jobs
    # kept, writes the table (an artifact; docs/traceability.md is committed from the final green
    # run) and fails when an MVP ID has no passing test. It runs even when a test job failed, so the
    # table shows what that failure cost.
    name: Traceability
    needs: [integration, e2e, expo]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - uses: actions/download-artifact@v8
        with:
          pattern: test-reports-*
          path: reports
      - name: Build the table
        run: node scripts/traceability.mjs --reports reports --out traceability.md --json traceability.json
      - name: Keep the table
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: traceability
          path: |
            traceability.md
            traceability.json
          retention-days: 90
      - name: Show the table in the run summary
        if: ${{ !cancelled() }}
        run: cat traceability.md >> "$GITHUB_STEP_SUMMARY"
